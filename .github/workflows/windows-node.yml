Copy-Item .github\workflows\windows-node.yml .github\workflows\windows-node.yml.bak

@'
name: Windows node build (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      CARGO_INCREMENTAL: "0"
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      PKG_CONFIG_ALLOW_CROSS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            clang \
            libclang-dev \
            llvm \
            protobuf-compiler \
            cmake \
            pkg-config

      - name: Configure Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src

      - name: Build Windows executable
        run: |
          cargo build --release --locked \
            --target x86_64-pc-windows-gnu \
            -p numen

      - name: Package Windows node
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/numen.exe dist/
          cp mainnet-raw.json dist/
          cp windows/start-numen.ps1 dist/
          cd dist
          zip -r ../numen-windows-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: numen-windows-x64
          path: numen-windows-x64.zip
'@ | Set-Content .github\workflows\windows-node.yml -Encoding UTF8
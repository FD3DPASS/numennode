name: Windows node build (experimental)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'node/**'
      - 'runtime/**'
      - 'consensus/**'
      - 'pallets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-node.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CMAKE_GENERATOR: 'Visual Studio 17 2022'
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and protoc
        shell: pwsh
        run: |
          choco install llvm protoc -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure Rust
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add rust-src
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: Compile native Windows node
        shell: pwsh
        run: cargo build --release --locked -p numen
      - name: Smoke test
        shell: pwsh
        run: .\target\release\numen.exe --version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\numen.exe dist\
          Copy-Item mainnet-raw.json dist\
          Copy-Item windows\start-numen.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath numen-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: numen-windows-x64
          path: numen-windows-x64.zip

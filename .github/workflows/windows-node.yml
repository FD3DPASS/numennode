
name: Windows Node Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_OPT_LEVEL: "0"

      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++

      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--verbose"

      PKG_CONFIG_ALLOW_CROSS: "1"
      CXXFLAGS_x86_64_pc_windows_gnu: "-include mutex -include thread"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-x86-64-posix \
            clang \
            lld \
            libclang-dev \
            llvm \
            protobuf-compiler \
            cmake \
            pkg-config \
            python3 \
            zip

      - name: Configure MinGW POSIX compiler
        run: |
          sudo update-alternatives --set \
            x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix

          sudo update-alternatives --set \
            x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix

          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version

      - name: Configure Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src

          rustc --version
          cargo --version

      - name: Download Rust dependencies
        run: |
          cargo fetch --locked \
            --target x86_64-pc-windows-gnu

      - name: Fix crunchy cross-compilation path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo" / "registry" / "src"
          files = list(root.glob("*/crunchy-0.2.3/src/lib.rs"))

          if not files:
              raise SystemExit(
                  "ERROR: crunchy v0.2.3 source not found"
              )

          for path in files:
              source = path.read_text()

              old = r'\\lib.rs'
              new = '/lib.rs'

              if old not in source:
                  raise SystemExit(
                      f"ERROR: Expected path not found: {path}"
                  )

              path.write_text(source.replace(old, new))
              print(f"Patched: {path}")
          PY

      - name: Verify Windows C++ compiler
        run: |
          x86_64-w64-mingw32-g++ --version

          printf '#include <mutex>\n#include <thread>\nint main() { std::mutex m; std::thread t; return 0; }\n' > test.cpp

          x86_64-w64-mingw32-g++ \
            -std=c++17 \
            -c test.cpp \
            -o test.o

          echo "Windows C++ compiler test passed"

      - name: Verify LLVM Windows linker
        run: |
          x86_64-w64-mingw32-gcc --version
          ld.lld --version

          printf 'int main(void) { return 0; }\n' > linker-test.c

          x86_64-w64-mingw32-gcc \
            -fuse-ld=lld \
            linker-test.c \
            -o linker-test.exe

          test -f linker-test.exe

          file linker-test.exe

          echo "LLVM Windows linker test passed"

      - name: Provide missing strnlen_s for MinGW
        run: |
          cat > strnlen_s.c <<'EOF'
          #include <stddef.h>

          size_t strnlen_s(const char *str, size_t maxsize) {
              size_t len = 0;
              if (str == NULL) return 0;
              while (len < maxsize && str[len] != '\0') {
                  ++len;
              }
              return len;
          }
          EOF

          x86_64-w64-mingw32-gcc -c \
            strnlen_s.c \
            -o strnlen_s.o

          x86_64-w64-mingw32-ar rcs \
            libnumen_compat.a \
            strnlen_s.o

          echo "NUMEN_COMPAT_LIB=$PWD" >> "$GITHUB_ENV"

      - name: Build Windows executable
        env:
          RUSTFLAGS: "-L native=${{ env.NUMEN_COMPAT_LIB }} -l static=numen_compat"
        run: |
          set -o pipefail

          cargo build \
            --release \
            --locked \
            --target x86_64-pc-windows-gnu \
            -p numen \
            2>&1 | tee windows-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: numen-windows-build-log
          path: windows-build.log
          if-no-files-found: ignore

      - name: Package Windows node
        run: |
          mkdir -p dist

          EXE="target/x86_64-pc-windows-gnu/release/numen.exe"

          if [ ! -f "$EXE" ]; then
            echo "ERROR: numen.exe not found"
            exit 1
          fi

          cp "$EXE" dist/

          if [ -f mainnet-raw.json ]; then
            cp mainnet-raw.json dist/
          fi

          if [ -f windows/start-numen.ps1 ]; then
            cp windows/start-numen.ps1 dist/
          fi

          cd dist
          zip -r ../numen-windows-x64.zip .

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: numen-windows-x64
          path: numen-windows-x64.zip
          if-no-files-found: error
